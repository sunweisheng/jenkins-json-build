name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shared-library:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./mvnw --batch-mode test
      - run: python3 -m unittest discover -s scripts/tests -v
