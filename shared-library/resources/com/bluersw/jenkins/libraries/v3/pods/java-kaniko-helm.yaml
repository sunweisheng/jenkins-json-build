apiVersion: v1
kind: Pod
metadata:
  labels:
    app.kubernetes.io/part-of: jenkins-json-build
spec:
  serviceAccountName: ${DEPLOY_SERVICE_ACCOUNT}
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: jnlp
      image: ${JNLP_IMAGE}
      env:
        - {name: HTTP_PROXY, value: "${POD_HTTP_PROXY}"}
        - {name: HTTPS_PROXY, value: "${POD_HTTPS_PROXY}"}
        - {name: NO_PROXY, value: "${POD_NO_PROXY}"}
        - {name: http_proxy, value: "${POD_HTTP_PROXY}"}
        - {name: https_proxy, value: "${POD_HTTPS_PROXY}"}
        - {name: no_proxy, value: "${POD_NO_PROXY}"}
      securityContext:
        runAsNonRoot: true
        runAsUser: ${POD_RUN_AS_USER}
        runAsGroup: ${POD_RUN_AS_GROUP}
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
    - name: maven
      image: ${MAVEN_IMAGE}
      command: ["cat"]
      tty: true
      env:
        - {name: HTTP_PROXY, value: "${POD_HTTP_PROXY}"}
        - {name: HTTPS_PROXY, value: "${POD_HTTPS_PROXY}"}
        - {name: NO_PROXY, value: "${POD_NO_PROXY}"}
        - {name: http_proxy, value: "${POD_HTTP_PROXY}"}
        - {name: https_proxy, value: "${POD_HTTPS_PROXY}"}
        - {name: no_proxy, value: "${POD_NO_PROXY}"}
      resources:
        requests:
          cpu: "${MAVEN_CPU_REQUEST}"
          memory: "${MAVEN_MEMORY_REQUEST}"
        limits:
          cpu: "${MAVEN_CPU_LIMIT}"
          memory: "${MAVEN_MEMORY_LIMIT}"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
    - name: kaniko
      image: ${KANIKO_IMAGE}
      command: ["/busybox/cat"]
      tty: true
      env:
        - name: DOCKER_CONFIG
          value: ${KANIKO_DOCKER_CONFIG}
        - {name: HTTP_PROXY, value: "${POD_HTTP_PROXY}"}
        - {name: HTTPS_PROXY, value: "${POD_HTTPS_PROXY}"}
        - {name: NO_PROXY, value: "${POD_NO_PROXY}"}
        - {name: http_proxy, value: "${POD_HTTP_PROXY}"}
        - {name: https_proxy, value: "${POD_HTTPS_PROXY}"}
        - {name: no_proxy, value: "${POD_NO_PROXY}"}
      resources:
        requests:
          cpu: "${IMAGE_BUILDER_CPU_REQUEST}"
          memory: "${IMAGE_BUILDER_MEMORY_REQUEST}"
        limits:
          cpu: "${IMAGE_BUILDER_CPU_LIMIT}"
          memory: "${IMAGE_BUILDER_MEMORY_LIMIT}"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: kaniko-config
          mountPath: ${KANIKO_DOCKER_CONFIG}
          readOnly: true
    - name: helm
      image: ${HELM_IMAGE}
      command: ["cat"]
      tty: true
      env:
        - name: HELM_DRIVER
          value: ${HELM_DRIVER}
        - {name: HTTP_PROXY, value: "${POD_HTTP_PROXY}"}
        - {name: HTTPS_PROXY, value: "${POD_HTTPS_PROXY}"}
        - {name: NO_PROXY, value: "${POD_NO_PROXY}"}
        - {name: http_proxy, value: "${POD_HTTP_PROXY}"}
        - {name: https_proxy, value: "${POD_HTTPS_PROXY}"}
        - {name: no_proxy, value: "${POD_NO_PROXY}"}
      resources:
        requests:
          cpu: "${HELM_CPU_REQUEST}"
          memory: "${HELM_MEMORY_REQUEST}"
        limits:
          cpu: "${HELM_CPU_LIMIT}"
          memory: "${HELM_MEMORY_LIMIT}"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: deploy-api
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
  volumes:
    - name: kaniko-config
      secret:
        secretName: ${KANIKO_SECRET_NAME}
        items:
          - key: .dockerconfigjson
            path: config.json
    - name: deploy-api
      projected:
        defaultMode: 420
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
          - downwardAPI:
              items:
                - path: namespace
                  fieldRef:
                    fieldPath: metadata.namespace
