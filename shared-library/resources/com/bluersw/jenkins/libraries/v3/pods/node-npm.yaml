apiVersion: v1
kind: Pod
metadata:
  labels:
    app.kubernetes.io/part-of: jenkins-json-build
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: ${POD_RUN_AS_USER}
    runAsGroup: ${POD_RUN_AS_GROUP}
    fsGroup: ${POD_FS_GROUP}
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: node
      image: ${NODE_IMAGE}
      command: ["cat"]
      tty: true
      env:
        - name: HOME
          value: ${NODE_USER_HOME}
        - name: npm_config_cache
          value: ${NODE_USER_HOME}/.npm
      resources:
        requests:
          cpu: "${NODE_CPU_REQUEST}"
          memory: "${NODE_MEMORY_REQUEST}"
        limits:
          cpu: "${NODE_CPU_LIMIT}"
          memory: "${NODE_MEMORY_LIMIT}"
      securityContext:
        runAsNonRoot: true
        runAsUser: ${POD_RUN_AS_USER}
        runAsGroup: ${POD_RUN_AS_GROUP}
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: node-home
          mountPath: ${NODE_USER_HOME}
  volumes:
    - name: node-home
      emptyDir: {}
