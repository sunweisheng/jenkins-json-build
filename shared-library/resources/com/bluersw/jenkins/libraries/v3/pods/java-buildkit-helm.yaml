apiVersion: v1
kind: Pod
metadata:
  labels:
    app.kubernetes.io/part-of: jenkins-json-build
spec:
  serviceAccountName: ${DEPLOY_SERVICE_ACCOUNT}
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: ${POD_RUN_AS_USER}
    runAsGroup: ${POD_RUN_AS_GROUP}
    fsGroup: ${POD_FS_GROUP}
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: maven
      image: ${MAVEN_IMAGE}
      command: ["cat"]
      tty: true
      env:
        - name: HOME
          value: ${MAVEN_USER_HOME}
        - name: MAVEN_CONFIG
          value: ${MAVEN_CONFIG}
        - name: MAVEN_OPTS
          value: >-
            -Duser.home=${MAVEN_USER_HOME}
            -Dmaven.repo.local=${MAVEN_REPOSITORY}
        - {name: HTTP_PROXY, value: "${POD_HTTP_PROXY}"}
        - {name: HTTPS_PROXY, value: "${POD_HTTPS_PROXY}"}
        - {name: NO_PROXY, value: "${POD_NO_PROXY}"}
        - {name: http_proxy, value: "${POD_HTTP_PROXY}"}
        - {name: https_proxy, value: "${POD_HTTPS_PROXY}"}
        - {name: no_proxy, value: "${POD_NO_PROXY}"}
      resources:
        requests:
          cpu: "${MAVEN_CPU_REQUEST}"
          memory: "${MAVEN_MEMORY_REQUEST}"
        limits:
          cpu: "${MAVEN_CPU_LIMIT}"
          memory: "${MAVEN_MEMORY_LIMIT}"
      securityContext:
        runAsNonRoot: true
        runAsUser: ${POD_RUN_AS_USER}
        runAsGroup: ${POD_RUN_AS_GROUP}
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: maven-home
          mountPath: ${MAVEN_USER_HOME}
        - name: maven-cache
          mountPath: ${MAVEN_CONFIG}
    - name: buildkit
      image: ${BUILDKIT_IMAGE}
      command: ["sh", "-c", "cat"]
      tty: true
      env:
        - name: BUILDKITD_FLAGS
          value: >-
            ${BUILDKITD_FLAGS} --root ${BUILDKIT_STATE_DIR}
        - name: DOCKER_CONFIG
          value: ${BUILDKIT_DOCKER_CONFIG}
        - {name: HTTP_PROXY, value: "${POD_HTTP_PROXY}"}
        - {name: HTTPS_PROXY, value: "${POD_HTTPS_PROXY}"}
        - {name: NO_PROXY, value: "${POD_NO_PROXY}"}
        - {name: http_proxy, value: "${POD_HTTP_PROXY}"}
        - {name: https_proxy, value: "${POD_HTTPS_PROXY}"}
        - {name: no_proxy, value: "${POD_NO_PROXY}"}
      resources:
        requests:
          cpu: "${IMAGE_BUILDER_CPU_REQUEST}"
          memory: "${IMAGE_BUILDER_MEMORY_REQUEST}"
        limits:
          cpu: "${IMAGE_BUILDER_CPU_LIMIT}"
          memory: "${IMAGE_BUILDER_MEMORY_LIMIT}"
      securityContext:
        runAsNonRoot: true
        runAsUser: ${BUILDKIT_RUN_AS_USER}
        runAsGroup: ${BUILDKIT_RUN_AS_GROUP}
        allowPrivilegeEscalation: true
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
        capabilities:
          add: ["SETUID", "SETGID"]
          drop: ["ALL"]
      volumeMounts:
        - name: buildkit-config
          mountPath: ${BUILDKIT_DOCKER_CONFIG}
          readOnly: true
        - name: buildkit-state
          mountPath: ${BUILDKIT_STATE_DIR}
    - name: helm
      image: ${HELM_IMAGE}
      command: ["cat"]
      tty: true
      env:
        - name: HELM_DRIVER
          value: ${HELM_DRIVER}
        - name: HOME
          value: ${HELM_USER_HOME}
        - {name: HTTP_PROXY, value: "${POD_HTTP_PROXY}"}
        - {name: HTTPS_PROXY, value: "${POD_HTTPS_PROXY}"}
        - {name: NO_PROXY, value: "${POD_NO_PROXY}"}
        - {name: http_proxy, value: "${POD_HTTP_PROXY}"}
        - {name: https_proxy, value: "${POD_HTTPS_PROXY}"}
        - {name: no_proxy, value: "${POD_NO_PROXY}"}
      resources:
        requests:
          cpu: "${HELM_CPU_REQUEST}"
          memory: "${HELM_MEMORY_REQUEST}"
        limits:
          cpu: "${HELM_CPU_LIMIT}"
          memory: "${HELM_MEMORY_LIMIT}"
      securityContext:
        runAsNonRoot: true
        runAsUser: ${POD_RUN_AS_USER}
        runAsGroup: ${POD_RUN_AS_GROUP}
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: helm-home
          mountPath: ${HELM_USER_HOME}
        - name: deploy-api
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
  volumes:
    - name: maven-home
      emptyDir: {}
    - name: maven-cache
      emptyDir: {}
    - name: helm-home
      emptyDir: {}
    - name: buildkit-config
      secret:
        secretName: ${BUILDKIT_REGISTRY_SECRET_NAME}
        items:
          - key: .dockerconfigjson
            path: config.json
    - name: buildkit-state
      emptyDir: {}
    - name: deploy-api
      projected:
        defaultMode: 420
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
          - downwardAPI:
              items:
                - path: namespace
                  fieldRef:
                    fieldPath: metadata.namespace
