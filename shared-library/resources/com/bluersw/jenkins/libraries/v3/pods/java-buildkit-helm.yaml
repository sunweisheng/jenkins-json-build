apiVersion: v1
kind: Pod
metadata:
  labels:
    app.kubernetes.io/part-of: jenkins-json-build
spec:
  serviceAccountName: ${DEPLOY_SERVICE_ACCOUNT}
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: maven
      image: ${MAVEN_IMAGE}
      command: ["cat"]
      tty: true
      resources:
        requests:
          cpu: "${MAVEN_CPU_REQUEST}"
          memory: "${MAVEN_MEMORY_REQUEST}"
        limits:
          cpu: "${MAVEN_CPU_LIMIT}"
          memory: "${MAVEN_MEMORY_LIMIT}"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
    - name: buildkit
      image: ${BUILDKIT_IMAGE}
      command: ["sh", "-c", "cat"]
      tty: true
      env:
        - name: BUILDKITD_FLAGS
          value: >-
            ${BUILDKITD_FLAGS} --root ${BUILDKIT_STATE_DIR}
        - name: DOCKER_CONFIG
          value: ${BUILDKIT_DOCKER_CONFIG}
      resources:
        requests:
          cpu: "${IMAGE_BUILDER_CPU_REQUEST}"
          memory: "${IMAGE_BUILDER_MEMORY_REQUEST}"
        limits:
          cpu: "${IMAGE_BUILDER_CPU_LIMIT}"
          memory: "${IMAGE_BUILDER_MEMORY_LIMIT}"
      securityContext:
        runAsNonRoot: true
        runAsUser: ${BUILDKIT_RUN_AS_USER}
        runAsGroup: ${BUILDKIT_RUN_AS_GROUP}
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: buildkit-config
          mountPath: ${BUILDKIT_DOCKER_CONFIG}
          readOnly: true
        - name: buildkit-state
          mountPath: ${BUILDKIT_STATE_DIR}
    - name: helm
      image: ${HELM_IMAGE}
      command: ["cat"]
      tty: true
      env:
        - name: HELM_DRIVER
          value: ${HELM_DRIVER}
      resources:
        requests:
          cpu: "${HELM_CPU_REQUEST}"
          memory: "${HELM_MEMORY_REQUEST}"
        limits:
          cpu: "${HELM_CPU_LIMIT}"
          memory: "${HELM_MEMORY_LIMIT}"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: deploy-api
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
  volumes:
    - name: buildkit-config
      secret:
        secretName: ${BUILDKIT_REGISTRY_SECRET_NAME}
        items:
          - key: .dockerconfigjson
            path: config.json
    - name: buildkit-state
      emptyDir: {}
    - name: deploy-api
      projected:
        defaultMode: 420
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
          - downwardAPI:
              items:
                - path: namespace
                  fieldRef:
                    fieldPath: metadata.namespace
